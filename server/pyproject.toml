[project]
name = "photofinder"
version = "0.1.0"
description = "Local semantic search for photos and video clips with CLIP + FAISS"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pillow>=10.3",
    "pillow-heif>=0.18",
    "numpy>=1.26,<3",
    "faiss-cpu>=1.8.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "open-clip-torch>=2.26",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0"]
